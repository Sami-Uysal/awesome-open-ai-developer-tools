name: Link check

# The list's only real product is accuracy, and a dead link is the fastest way
# to lose it. Runs on every PR that touches Markdown, plus weekly to catch
# projects that disappear on their own.
on:
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Concurrency is capped because every entry points at github.com and
          # rate-limiting shows up as false "broken link" reports. 429 is
          # accepted for the same reason.
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --retry-wait-time 10
            --max-retries 3
            --accept 200,206,429
            "**/*.md"
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
