name: Sync docs/index.md from README

on:
  push:
    branches:
      - main
    paths:
      - README.md

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync docs/index.md from README.md
        run: node scripts/sync-docs-index.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          if git diff --cached --quiet; then
            echo "docs/index.md already in sync."
          else
            git commit -m "chore: sync docs/index.md from README.md"
            git push
          fi
