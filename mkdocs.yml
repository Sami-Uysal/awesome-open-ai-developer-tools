site_name: Awesome Open AI Developer Tools
site_description: A curated directory of open-source AI tools, local LLM engines, and agents.
site_author: Sami Uysal
site_url: https://sami-uysal.github.io/awesome-open-ai-developer-tools/

repo_url: https://github.com/Sami-Uysal/awesome-open-ai-developer-tools
repo_name: Sami-Uysal/awesome-open-ai-developer-tools

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Translations:
      - "Türkçe": README.tr.md
      - "Español": README.es.md
      - "中文": README.zh-CN.md
  - Community:
      - "Contributing": CONTRIBUTING.md
      - "Translations Info": TRANSLATIONS.md

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
